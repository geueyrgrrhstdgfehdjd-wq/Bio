<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bio Studio Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body class="dashboard-body">

  <canvas id="bg-3d-canvas"></canvas>

  <div class="dashboard-layout">
    
    <!-- Header / Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-title">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" width="20" height="20">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 6h97.5M10.5 6a1.5 1.5 0 1 1-3 0m3 0a1.5 1.5 0 1 0-3 0M3.75 6H7.5m3 12h9.75m-9.75 0a1.5 1.5 0 1 1-3 0m3 0a1.5 1.5 0 1 0-3 0m-3.75 0H7.5m9-6h3.75m-3.75 0a1.5 1.5 0 1 1-3 0m3 0a1.5 1.5 0 1 0-3 0m-9.75 0h9.75" />
        </svg>
        <h2>3D STUDIO DASHBOARD</h2>
      </div>
      <div id="menu-list" class="menu-list"></div>
    </aside>

    <!-- Main Content Input -->
    <main class="content-area">
      <div class="content-header">
        <h2 id="current-tab-title">โปรไฟล์</h2>
        <a href="./bio.html" target="_blank" class="view-btn">
          <span>ดูหน้า Bio จริง</span>
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" width="16" height="16">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 6H5.25A2.25 2.25 0 0 0 3 8.25v10.5A2.25 2.25 0 0 0 5.25 21h10.5A2.25 2.25 0 0 0 18 18.75V10.5m-10.5 6L21 3m0 0h-5.25M21 3v5.25" />
          </svg>
        </a>
      </div>

      <div class="form-card">
        <div id="tab-content"></div>
      </div>
    </main>

    <!-- Preview Area -->
    <aside class="preview-area">
      <span class="preview-title">Real-Time 3D Live Preview</span>
      <div id="phone-preview" class="phone-mockup">
        <div id="prev-avatar-container" class="avatar-3d-wrapper" style="display:none;">
          <div id="prev-frame-wrapper">
            <img id="prev-avatar" class="avatar-img" src="">
          </div>
          <span id="prev-badge" class="badge-3d" style="display:none;"></span>
        </div>
        <h3 id="prev-name" class="bio-title-3d"></h3>
        <p id="prev-bio" class="bio-desc-3d"></p>
        <div id="prev-links" class="links-container-3d"></div>
      </div>
    </aside>

  </div>

  <script src="js/app.js"></script>
</body>
</html>
