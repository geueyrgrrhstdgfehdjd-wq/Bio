<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Bio Profile</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body class="bio-page-body">

  <canvas id="bg-3d-canvas"></canvas>

  <div id="card-3d" class="bio-card-3d">
    <div id="avatar-container" class="avatar-3d-wrapper" style="display: none;">
      <div id="frame-wrapper">
        <img id="bio-avatar" class="avatar-img" src="" alt="Avatar">
      </div>
      <span id="bio-badge" class="badge-3d" style="display: none;"></span>
    </div>

    <h1 id="bio-name" class="bio-title-3d"></h1>
    <p id="bio-desc" class="bio-desc-3d"></p>

    <div id="bio-links" class="links-container-3d"></div>

    <p id="empty-notice" style="color:#64748b; font-size:14px; text-align:center;">
      ยังไม่มีข้อมูล โปรดตั้งค่าในหน้า Dashboard (<a href="./index.html" style="color:#3b82f6;">index.html</a>)
    </p>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
