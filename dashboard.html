<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Dashboard - ปรับแต่งหน้า Bio</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body class="dashboard-body">

  <div class="dashboard-layout">
    
    <aside class="sidebar">
      <div class="sidebar-title">
        <img src="https://img.icons8.com/plasticine/100/settings.png" width="30">
        <h2>BIO DASHBOARD</h2>
      </div>
      <div id="menu-list" class="menu-list"></div>
    </aside>

    <main class="content-area">
      <div class="content-header">
        <h2 id="current-tab-title">โปรไฟล์</h2>
        <a href="index.html" target="_blank" class="view-btn">เปิดดูหน้า Bio จริง 🚀</a>
      </div>

      <div id="tab-content" class="tab-content"></div>
    </main>

    <aside class="preview-area">
      <div class="phone-mockup">
        <div class="avatar-wrapper">
          <img id="prev-avatar" class="avatar-img" src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150">
          <span id="prev-badge" class="badge-tag">VERIFIED</span>
        </div>
        <h3 id="prev-name">JOHN DOE</h3>
        <p id="prev-bio">Creative Developer</p>
        <div id="prev-links" class="links-container"></div>
      </div>
    </aside>

  </div>

  <script src="js/options.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
